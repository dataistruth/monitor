resources:
  jobs:
    monitor_refresh:
      name: monitor-refresh-${bundle.target}
      description: >
        Looping refresh of cluster + process monitoring objects.
        Frequency controlled by monitor_frequency_seconds.
        Runs on serverless compute.
      tags:
        project: monitor
        purpose: system-table-refresh
      permissions:
        - level: CAN_MANAGE
          group_name: ${var.grant_group}
      # Job-level params (list form). Do not also set notebook base_parameters.
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: workspace_id
          default: ${var.workspace_id}
        - name: monitor_frequency_seconds
          default: ${var.monitor_frequency_seconds}
        - name: max_iterations
          default: "0"
      tasks:
        - task_key: refresh_loop
          notebook_task:
            notebook_path: ../src/notebooks/monitor_loop.py
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
      max_concurrent_runs: 1
      # Long-running loop: cancel the run to stop. Change frequency via
      # job parameter monitor_frequency_seconds (or redeploy the bundle var).
      timeout_seconds: 0
      performance_target: STANDARD
