resources:
  jobs:
    monitor_refresh:
      name: monitor-refresh-${bundle.target}
      description: >
        Looping refresh of cluster + process monitoring objects.
        Frequency controlled by monitor_frequency_seconds.
        Runs on serverless compute.
      tags:
        project: monitor
        purpose: system-table-refresh
      permissions:
        - level: CAN_MANAGE
          group_name: ${var.grant_group}
      tasks:
        - task_key: refresh_loop
          notebook_task:
            notebook_path: ../src/notebooks/monitor_loop.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              workspace_id: ${var.workspace_id}
              monitor_frequency_seconds: "${var.monitor_frequency_seconds}"
              max_iterations: "0"
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
      max_concurrent_runs: 1
      # Long-running loop: cancel the run to stop. Change frequency via
      # bundle var monitor_frequency_seconds and redeploy.
      timeout_seconds: 0
      performance_target: STANDARD
