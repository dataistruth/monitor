resources:
  jobs:
    e2e_hello_print:
      name: e2e_hello_print
      max_concurrent_runs: 1
      tags:
        project: monitor
        purpose: e2e-pool-job-cluster-test
      permissions:
        - level: CAN_MANAGE
          group_name: ${var.grant_group}
      email_notifications:
        on_failure:
          - ${var.job_alert_email}
        on_success: []
        on_start: []
      tasks:
        - task_key: print_jcs1
          job_cluster_key: JCS1
          max_retries: ${var.job_max_retries}
          spark_python_task:
            python_file: ${workspace.file_path}/scripts/hello_print.py
            parameters:
              - JCS1
        - task_key: print_jcs2
          job_cluster_key: JCS2
          max_retries: ${var.job_max_retries}
          depends_on:
            - task_key: print_jcs1
          spark_python_task:
            python_file: ${workspace.file_path}/scripts/hello_print.py
            parameters:
              - JCS2
        - task_key: print_jcs3
          job_cluster_key: JCS3
          max_retries: ${var.job_max_retries}
          depends_on:
            - task_key: print_jcs2
          spark_python_task:
            python_file: ${workspace.file_path}/scripts/hello_print.py
            parameters:
              - JCS3
      job_clusters:
        - job_cluster_key: JCS1
          new_cluster: ${var.cluster_jcs1}
        - job_cluster_key: JCS2
          new_cluster: ${var.cluster_jcs2}
        - job_cluster_key: JCS3
          new_cluster: ${var.cluster_jcs3}
